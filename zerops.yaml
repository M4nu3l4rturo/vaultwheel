zerops:
  # ─────────────────────────────────────────────────────────
  # BACKEND — FastAPI (Python 3.12)
  # Hostname en Zerops: backend
  # ─────────────────────────────────────────────────────────
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - pip install --upgrade pip
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
        - main.py
      cache:
        - ~/.cache/pip~backend/requirements.txt

    run:
      base: python@3.12
      prepareCommands:
        - pip install --upgrade pip
        - pip install fastapi==0.115.0 "uvicorn[standard]==0.32.0" sqlalchemy==2.0.36 psycopg2-binary==2.9.10 pydantic==2.10.3 pydantic-settings==2.6.1 "python-jose[cryptography]==3.3.0" "passlib[bcrypt]==1.7.4" bcrypt==4.0.1 python-multipart==0.0.12 web3==7.6.0 httpx==0.27.2 alembic==1.14.0 email-validator==2.3.0
      ports:
        - port: 8000
          httpSupport: true
      start: python3 main.py
      envVariables:
        DATABASE_URL: "postgresql://${db_user}:${db_password}@${db_hostname}:${db_port}/${db_database}"
        DEMO_MODE: "true"
        POLYGON_RPC_URL: "https://rpc-amoy.polygon.technology"
        PYTHONDONTWRITEBYTECODE: "1"

  # ─────────────────────────────────────────────────────────
  # FRONTEND — React/Vite → Nginx Static
  # Hostname en Zerops: frontend
  # ─────────────────────────────────────────────────────────
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles:
        - frontend/dist
        - frontend/nginx.conf

    run:
      base: nginx@1.22
      prepareCommands:
        - mkdir -p /var/lib/nginx/tmp /var/lib/nginx/logs /tmp/client_temp /tmp/proxy_temp_path
        - chmod -R 777 /var/lib/nginx /tmp
      ports:
        - port: 80
          httpSupport: true
      start: nginx -g 'daemon off;' -c /var/www/nginx.conf
