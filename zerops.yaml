zerops:
  # ─────────────────────────────────────────────────────────
  # BACKEND — FastAPI (Python 3.12)
  # Hostname en Zerops: backend
  # ─────────────────────────────────────────────────────────
  - setup: backend
    build:
      base: python@3.12
      buildCommands:
        - pip install --upgrade pip
        - pip install -r backend/requirements.txt
      deployFiles:
        - backend
        - main.py
      cache:
        - ~/.cache/pip~backend/requirements.txt

    run:
      base: python@3.12
      prepareCommands:
        - pip install --upgrade pip
        - pip install -r backend/requirements.txt
      ports:
        - port: 8000
          httpSupport: true
      start: python3 main.py
      envVariables:
        DATABASE_URL: "postgresql://vaultwheel:vaultwheel@db:5432/vaultwheel"
        DEMO_MODE: "true"
        POLYGON_RPC_URL: "https://rpc-amoy.polygon.technology"
        PYTHONDONTWRITEBYTECODE: "1"

  # ─────────────────────────────────────────────────────────
  # FRONTEND — React/Vite → Nginx Static
  # Hostname en Zerops: frontend
  # ─────────────────────────────────────────────────────────
  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build && cp public/nginx.conf dist/nginx.conf
      deployFiles:
        - frontend/dist/

    run:
      base: nginx@1.22
      ports:
        - port: 80
          httpSupport: true
      start: nginx -g 'daemon off;' -c /var/www/nginx.conf
